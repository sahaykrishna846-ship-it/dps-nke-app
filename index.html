<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DPS Narkatiaganj Parent App</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3158c9">

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#222;
}
.container{
  max-width:500px;
  margin:auto;
  padding:20px;
}
.card{
  background:white;
  padding:20px;
  margin:12px 0;
  border-radius:16px;
  box-shadow:0 3px 12px #0001;
}
h1,h2{margin-top:0}
input{
  width:100%;
  padding:14px;
  margin:8px 0;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
}
button{
  width:100%;
  padding:14px;
  margin:8px 0;
  border:0;
  border-radius:10px;
  background:#3158c9;
  color:white;
  font-size:16px;
  font-weight:bold;
}
.red{background:#d93025}
.hidden{display:none}
.menu{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.menu button{
  background:white;
  color:#222;
  box-shadow:0 2px 8px #0001;
}
.student{
  border-left:5px solid #3158c9;
  padding:12px;
  margin:10px 0;
  background:#f7f9ff;
  border-radius:8px;
}
</style>
</head>

<body>

<!-- LOGIN PAGE -->
<div id="loginPage" class="container">

  <div class="card">
    <h1>🏫 DPS Narkatiaganj</h1>
    <p>Parent Portal</p>

    <input id="username" placeholder="Parent ID">
    <input id="password" type="password" placeholder="Password">

    <button onclick="login()">Parent Login</button>

    <button onclick="adminLogin()">🔐 Admin Login</button>

    <p id="error"></p>
  </div>

</div>


<!-- PARENT APP -->
<div id="app" class="container hidden">

  <div class="card">
    <h1>👋 Welcome</h1>
    <h2 id="parentStudent">Rahul Kumar</h2>
    <p>Class 8-A | Roll No. 15</p>
  </div>

  <div class="menu">

    <button onclick="showMessage('Attendance: 92%')">
      📅 Attendance
    </button>

    <button onclick="showMessage('No new homework')">
      📚 Homework
    </button>

    <button onclick="showMessage('Fees status: Paid')">
      💰 Fees
    </button>

    <button onclick="showMessage('Latest Result: Available')">
      📝 Results
    </button>

    <button onclick="showMessage('School will remain open tomorrow.')">
      📢 Notices
    </button>

    <button onclick="showMessage('Timetable: Available')">
      🕐 Timetable
    </button>

  </div>

  <button class="red" onclick="logout()">Logout</button>

</div>


<!-- ADMIN PANEL -->
<div id="adminPanel" class="container hidden">

  <div class="card">

    <h1>🔐 Admin Panel</h1>

    <h2>Add Student</h2>

    <input id="studentName" placeholder="Student Name">

    <input id="studentClass" placeholder="Class">

    <input id="studentRoll" placeholder="Roll Number">

    <input id="parentId" placeholder="Parent ID">

    <button onclick="addStudent()">➕ Add Student</button>

  </div>

  <div class="card">

    <h2>🧑‍🎓 Students</h2>

    <div id="studentList">
      <p>No students added yet.</p>
    </div>

  </div>

  <button class="red" onclick="adminLogout()">Admin Logout</button>

</div>


<script>

function login(){

  let u=document.getElementById("username").value;
  let p=document.getElementById("password").value;

  if(u==="parent001" && p==="123456"){

    document.getElementById("loginPage").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");

  }else{

    document.getElementById("error").innerText=
    "Invalid Parent ID or Password";

  }
}


function adminLogin(){

  let id=prompt("Admin ID:");
  let password=prompt("Admin Password:");

  if(id==="admin" && password==="admin123"){

    document.getElementById("loginPage").classList.add("hidden");
    document.getElementById("adminPanel").classList.remove("hidden");

  }else{

    alert("Wrong Admin ID or Password");

  }
}


function addStudent(){

  let name=document.getElementById("studentName").value;
  let cls=document.getElementById("studentClass").value;
  let roll=document.getElementById("studentRoll").value;
  let parent=document.getElementById("parentId").value;

  if(!name || !cls || !roll || !parent){

    alert("Please fill all details");
    return;

  }

  let list=document.getElementById("studentList");

  let student=document.createElement("div");

  student.className="student";

  student.innerHTML=
  "<b>👤 "+name+"</b><br>"+
  "Class: "+cls+"<br>"+
  "Roll No: "+roll+"<br>"+
  "Parent ID: "+parent;

  list.appendChild(student);

  document.getElementById("studentName").value="";
  document.getElementById("studentClass").value="";
  document.getElementById("studentRoll").value="";
  document.getElementById("parentId").value="";

  alert("Student added successfully!");

}


function showMessage(message){
  alert(message);
}


function logout(){

  document.getElementById("app").classList.add("hidden");
  document.getElementById("loginPage").classList.remove("hidden");

}


function adminLogout(){

  document.getElementById("adminPanel").classList.add("hidden");
  document.getElementById("loginPage").classList.remove("hidden");

}


if("serviceWorker" in navigator){

  navigator.serviceWorker.register("sw.js");

}

</script>

</body>
</html>
