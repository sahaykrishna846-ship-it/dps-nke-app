<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DPS Narkatiaganj Parent App</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3158c9">

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#222}
.container{max-width:500px;margin:auto;padding:20px}
.card{background:white;padding:20px;margin:12px 0;border-radius:16px;box-shadow:0 3px 12px #0001}
input{width:100%;padding:14px;margin:8px 0;border:1px solid #ddd;border-radius:10px;font-size:16px}
button{width:100%;padding:14px;margin:8px 0;border:0;border-radius:10px;background:#3158c9;color:white;font-size:16px;font-weight:bold}
.red{background:#d93025}
.hidden{display:none}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.menu button{background:white;color:#222;box-shadow:0 2px 8px #0001}
.student{border-left:5px solid #3158c9;padding:12px;margin:10px 0;background:#f7f9ff;border-radius:8px}
#error{color:#d93025}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="container">
<div class="card">
<h1>🏫 DPS Narkatiaganj</h1>
<p>Parent Portal</p>

<input id="username" placeholder="Parent Email">
<input id="password" type="password" placeholder="Password">

<button onclick="login()">Parent Login</button>
<button onclick="adminLogin()">🔐 Admin Login</button>

<p id="error"></p>
</div>
</div>


<!-- PARENT APP -->
<div id="app" class="container hidden">

<div class="card">
<h1>👋 Welcome</h1>
<h2 id="parentStudent">Student</h2>
<p id="studentInfo"></p>
</div>

<div class="menu">
<button onclick="showMessage('Attendance section')">📅 Attendance</button>
<button onclick="showMessage('Homework section')">📚 Homework</button>
<button onclick="showMessage('Fees section')">💰 Fees</button>
<button onclick="showMessage('Results section')">📝 Results</button>
<button onclick="showMessage('Notices section')">📢 Notices</button>
<button onclick="showMessage('Timetable section')">🕐 Timetable</button>
</div>

<button class="red" onclick="logout()">Logout</button>
</div>


<!-- ADMIN -->
<div id="adminPanel" class="container hidden">

<div class="card">
<h1>🔐 Admin Panel</h1>
<h2>➕ Add Student</h2>

<input id="studentName" placeholder="Student Name">
<input id="studentClass" placeholder="Class">
<input id="studentRoll" placeholder="Roll Number">
<input id="parentEmail" placeholder="Parent Email">

<button onclick="addStudent()">Add Student</button>
</div>

<div class="card">
<h2>🧑‍🎓 Students</h2>
<div id="studentList">
<p>No students added.</p>
</div>
</div>

<button class="red" onclick="adminLogout()">Admin Logout</button>
</div>


<!-- FIREBASE -->
<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  query,
  where,
  getDocs
}
from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


const firebaseConfig = {
  apiKey: "AIzaSyBoDLUAc-y9nqFBn8vB9wRUUtMY0WALxwA",
  authDomain: "dps-narkatiaganj.firebaseapp.com",
  projectId: "dps-narkatiaganj",
  storageBucket: "dps-narkatiaganj.firebasestorage.app",
  messagingSenderId: "199351719662",
  appId: "1:199351719662:web:612fb6010c40a42c2a45ff",
  measurementId: "G-49BGF6LQ9P"
};

const firebaseApp = initializeApp(firebaseConfig);
const auth = getAuth(firebaseApp);
const db = getFirestore(firebaseApp);


window.login = async function(){

  const email = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value;

  try{

    const result = await signInWithEmailAndPassword(
      auth,email,password
    );

    const userEmail = result.user.email;

    const q = query(
      collection(db,"students"),
      where("parentEmail","==",userEmail)
    );

    const snapshot = await getDocs(q);

    document.getElementById("loginPage").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");

    if(snapshot.empty){

      document.getElementById("parentStudent").innerText =
      "No student linked";

      document.getElementById("studentInfo").innerText =
      "Please contact school admin.";

    }else{

      snapshot.forEach(doc => {

        const s = doc.data();

        document.getElementById("parentStudent").innerText =
        s.name;

        document.getElementById("studentInfo").innerText =
        "Class: " + s.class +
        " | Roll No: " + s.roll;

      });

    }

  }catch(error){

    document.getElementById("error").innerText =
    "Invalid email or password.";

  }

};


window.adminLogin = function(){

  const id = prompt("Admin ID:");
  const password = prompt("Admin Password:");

  if(id === "admin" && password === "admin123"){

    document.getElementById("loginPage").classList.add("hidden");
    document.getElementById("adminPanel").classList.remove("hidden");

  }else{

    alert("Wrong Admin ID or Password");

  }

};


window.addStudent = async function(){

  const name =
  document.getElementById("studentName").value.trim();

  const cls =
  document.getElementById("studentClass").value.trim();

  const roll =
  document.getElementById("studentRoll").value.trim();

  const parentEmail =
  document.getElementById("parentEmail").value.trim();

  if(!name || !cls || !roll || !parentEmail){

    alert("Please fill all details.");
    return;

  }

  try{

    await addDoc(collection(db,"students"),{

      name:name,
      class:cls,
      roll:roll,
      parentEmail:parentEmail

    });

    alert("Student saved successfully!");

    document.getElementById("studentName").value="";
    document.getElementById("studentClass").value="";
    document.getElementById("studentRoll").value="";
    document.getElementById("parentEmail").value="";

  }catch(error){

    alert("Database error: " + error.message);

  }

};


window.logout = function(){

  document.getElementById("app").classList.add("hidden");
  document.getElementById("loginPage").classList.remove("hidden");

};


window.adminLogout = function(){

  document.getElementById("adminPanel").classList.add("hidden");
  document.getElementById("loginPage").classList.remove("hidden");

};


window.showMessage = function(message){
  alert(message);
};

</script>


<script>
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js");
}
</script>

</body>
</html>
